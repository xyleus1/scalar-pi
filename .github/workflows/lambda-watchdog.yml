name: Lambda deadline watchdog

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'JSON: instance_name, workspace_id, worker_commit, region, instance_type, deadline_utc, launch_window_seconds'
        required: true
        type: string
      dry_run:
        description: 'Exercise the artifact handshake without credentials or cloud requests'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: scalar-pi-lambda-watchdog-${{ fromJSON(inputs.request).instance_name }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'xyleus1/scalar-pi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: lambda-cleanup
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Record execution window
        run: echo "WATCHDOG_JOB_STARTED_UNIX=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Arm cleanup
        env:
          SCALAR_PI_WATCHDOG_REQUEST: ${{ inputs.request }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run }}
          LAMBDA_TERMINATE_API_KEY: ${{ !inputs.dry_run && secrets.LAMBDA_TERMINATE_API_KEY || '' }}
        run: |
          arguments=()
          if [[ "$WATCHDOG_DRY_RUN" == false ]]; then arguments+=(--execute); fi
          python scripts/lambda/watchdog.py arm --output watchdog/armed.json "${arguments[@]}"

      - name: Publish armed receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-watchdog-armed-${{ github.run_id }}-${{ github.run_attempt }}
          path: watchdog/armed.json
          if-no-files-found: error
          retention-days: 7
          archive: true

      # The local launch gate must verify this exact step is in_progress in the
      # matching run/attempt/SHA. An artifact alone never authorizes a launch.
      - name: Watch deadline
        env:
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run }}
          LAMBDA_TERMINATE_API_KEY: ${{ !inputs.dry_run && secrets.LAMBDA_TERMINATE_API_KEY || '' }}
        run: |
          arguments=()
          if [[ "$WATCHDOG_DRY_RUN" == false ]]; then arguments+=(--execute); fi
          python scripts/lambda/watchdog.py watch --armed watchdog/armed.json --output watchdog/result.json "${arguments[@]}"

      - name: Preserve cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-watchdog-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: watchdog/
          if-no-files-found: warn
          retention-days: 30
          archive: true
