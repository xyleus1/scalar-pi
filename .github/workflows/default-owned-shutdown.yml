name: Default project instance deadline
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Original new default-workspace provider instance ID
        required: true
        type: string
      target_sha256:
        description: Digest of the private canonical per-host acquisition evidence
        required: true
        type: string
      deadline_unix:
        description: Finite UTC Unix work deadline for the assigned instance
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'xyleus1/scalar-pi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: lambda-cleanup
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      INSTANCE_ID: ${{ inputs.instance_id }}
      TARGET_SHA256: ${{ inputs.target_sha256 }}
      DEADLINE_UNIX: ${{ inputs.deadline_unix }}
    steps:
      - name: Record execution window
        run: echo "WATCHDOG_JOB_STARTED_UNIX=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out trusted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Arm existing instance
        env:
          DEFAULT_TARGET: ${{ secrets[format('DEFAULT_TARGET_{0}', inputs.instance_id)] }}
          DEFAULT_AUDIT: ${{ secrets[format('DEFAULT_AUDIT_{0}', inputs.instance_id)] }}
          DEFAULT_KEY: ${{ secrets[format('DEFAULT_KEY_{0}', inputs.instance_id)] }}
        run: python3 scripts/lambda/default_existing_watchdog.py arm

      - name: Publish armed receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: default-armed-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.instance_id }}
          path: manual-watchdog/armed.json
          if-no-files-found: error
          retention-days: 7

      - name: Watch existing instance deadline
        if: ${{ !cancelled() && hashFiles('manual-watchdog/armed.json') != '' }}
        env:
          DEFAULT_TARGET: ${{ secrets[format('DEFAULT_TARGET_{0}', inputs.instance_id)] }}
          DEFAULT_AUDIT: ${{ secrets[format('DEFAULT_AUDIT_{0}', inputs.instance_id)] }}
          DEFAULT_KEY: ${{ secrets[format('DEFAULT_KEY_{0}', inputs.instance_id)] }}
        run: python3 scripts/lambda/default_existing_watchdog.py watch

      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: default-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.instance_id }}
          path: manual-watchdog/
          if-no-files-found: warn
          retention-days: 30
