# The two paper snapshots are immutable estimator sources, checked by hash/AST tests.
exclude: ^(third_party/|paper/reproducibility/(statistics|analysis_entrypoint)\.py$)

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.14
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
